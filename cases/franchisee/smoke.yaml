name: franchisee 冒烟测试
description: 登录一次后依次执行结算记录查询与运营设置查询
setup:
  # --- 登录（只执行一次） ---
  - action: goto
    target: 登录页
  - action: input
    target: 请输入您的账号
    params: { value: "${ACCOUNT}" }
  - action: input
    target: 请输入您的密码
    params: { value: "${PASSWORD}" }
  - action: click
    target: 登录按钮
  - action: verify
    target: 登录成功
    params: { expect: "页面跳转到后台/工作台/首页，不再停留在登录页" }

cases:
  # --- 用例1：结算记录查询 ---
  - name: 结算记录查询
    description: 查询结算记录（结算时间=2026年8月）
    steps:
      - action: click
        target: 收入结算
      - action: click
        target: 结算记录
      - action: input
        target: 开始时间
        params: { value: "2026-08-01 00:00:00" }
      - action: input
        target: 结束时间
        params: { value: "2026-08-31 23:59:59" }
      - action: click
        target: 查询
      - action: conclude
        params:
          text: "用一句话输出本用例是否成功：结算记录是否成功（结算时间=2026年8月、已加载结算记录列表）。"

  # --- 用例2：运营设置查询 ---
  - name: 运营设置查询
    description: 查询运营设置（站点信息 + 充电枪列表已加载）
    steps:
      - action: click
        target: 运营设置
      - action: click
        target: 运营商设置查询
      - action: conclude
        params:
          text: "用一句话输出本用例是否成功：运营设置是否成功（已加载站点信息+充电枪列表）。"