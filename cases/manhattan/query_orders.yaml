name: 充电订单查询
description: 登录后查询充电订单（单据时间=订单创建时间、过去10天不含今天）
steps:
  # --- 登录 ---
  - action: goto
    target: 登录页
  - action: input
    target: 请输入您的账号
    params: { value: "${TEST_ACCOUNT}" }
  - action: input
    target: 请输入您的密码
    params: { value: "${TEST_PASSWORD}" }
  - action: click
    target: 登录按钮
    locator: { id: login }
  - action: verify
    target: 登录成功
    params: { expect: "页面跳转到后台/工作台/首页，不再停留在登录页" }

  # --- 充电订单管理 ---
  - action: click
    target: 订单管理
  - action: click
    target: 充电订单管理
  - action: select_option
    target: 单据时间
    params: { option: "订单创建时间" }
  - action: verify
    target: 日期范围
    params:
      expect: "开始时间与结束时间为『过去10天不含今天』的窗口；系统已自动设好，若已正确则直接使用、勿改动、勿点开日历或重新输入"
  - action: click
    target: 查询

  # --- 结论 ---
  - action: conclude
    params:
      text: "用一句话输出本用例是否成功：充电订单管理是否成功（单据时间=订单创建时间、日期=过去10天不含今天、订单列表已加载）。"
