[project]
name = "py-web-testing"
version = "0.1.0"
description = "browser-use 驱动的 Web 自动化测试框架（元素记忆 + 弹窗看门狗 + 用例 YAML 驱动）"
requires-python = ">=3.13"
dependencies = [
    "browser-use==0.13.10",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
