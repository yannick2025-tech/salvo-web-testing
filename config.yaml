# py-web-testing 总配置
# 模型 provider：当前生效的模型（deepseek 或 qwen）
llm:
  provider: qwen          # deepseek | qwen

  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    temperature: 0.0

  qwen:
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.7-max
    temperature: 0.0
    max_completion_tokens: 8192

# 多平台注册表：一个平台对应一个用例组，host 精确匹配用于路由记忆分片。
# runner 通过 --platform <alias> 或从用例路径推断当前平台。
# 敏感信息（域名/URL）用 ${VAR} 占位符，真实值放本地 .env（见 .env.example）。
platforms:
  manhattan:
    host: ${MANHATTAN_HOST}
    login_url: ${MANHATTAN_LOGIN_URL}

# 元素记忆（与 browser_use_ext 的 ElementMemoryConfig 同结构）
element_memory:
  enabled: true
  storage_path: ./memory/elements.json   # 兼容旧单文件（无平台上下文时回退）
  key_mode: flat
  match_mode: exact
  max_memories: 50000
  auto_learn: true
  min_retry_threshold: 2
  auto_apply_enabled: true
  date_range_days_back: 10
  date_range_include_today: false
  # 记忆分片：按「平台(host) + URL path 第一段」拆多 JSON。
  # platform_alias / platform_host 由 runner 按 --platform 注入，无需在此写死。
  sharding_enabled: true
  shard_dir: ./memory

# 弹窗看门狗（与 browser_use_ext 的 PopupWatchdogConfig 同结构）
popup_watchdog:
  enabled: true
  strategy: aggressive
  custom_selectors: []
  whitelist_selectors: []
  scan_on_step: true
  scan_on_navigation: true
  scan_delay_ms: 500
  z_index_threshold: 1000
  overlay_min_area_ratio: 0.3

# 执行器（runner）参数：透传给 browser-use Agent。
# llm_timeout 默认按模型名推断（qwen 约 60-90s，对大 DOM 太紧），显式调大。
# step_timeout 兜底单步上限（含 auto_apply + LLM + action 执行）。
# max_actions_per_step 控制 LLM 每步可输出的 action 数，影响 prompt 大小。
runner:
  llm_timeout: 120
  step_timeout: 180
  max_actions_per_step: 5
  max_failures: 5
  # DOM 视口裁剪（方案B）：收紧 browser-use 视口阈值，让「只列视口内元素」生效。
  # 默认 1000 过宽，大列表页面大量视口外记录被列入；收紧为 200（梯度测试 0/200 后，200 为最优点）。
  viewport_threshold: 200
  # 工具精简（方案C1）：排除本项目用不到的工具，降低 tools 定义的 token 开销。
  tool_exclude:
    - search
    - upload_file
    - save_as_pdf
    - write_file
    - replace_file
    - read_file
    - find_text
    - close

# 计量（profiling）：量化每次 LLM 调用 prompt 各部分占比（纯观测，不影响执行）。
# 用于定位「token 花在哪」、为 prompt 裁剪提供基线；优化完成后可置 false 关闭。
profiling:
  enabled: true
